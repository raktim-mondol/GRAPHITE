# Read the Docs configuration file for GRAPHITE
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, set the version to match your local environment
build:
  os: ubuntu-22.04
  tools:
    python: "3.9"

# Since we're using the hosted documentation at xai.readthedocs.io/en/latest/
# we don't need to build documentation locally.
# This is a reference configuration if we want to generate docs in the future.

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    - requirements: requirements.txt
